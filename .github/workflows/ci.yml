name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Syntax & Invariant Check
        run: |
          node --check server/heuristics/evaluate.js
          node --check server/crawler/crawl.js
          node --check server/crawler/roiScorer.js
      - name: Unit Tests
        run: npm test
      - name: Web UI Build
        run: npm run build:web
