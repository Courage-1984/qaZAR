services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: qazar:latest
    container_name: qazar-api
    restart: unless-stopped
    command: ["node", "server/index.js"]
    ports:
      - "8787:8787"
    environment:
      - PORT=8787
      - DATA_DIR=/app/data
      - PAGE_CONCURRENCY=4
      - ALLOW_PRIVATE=0
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8787/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: qazar:latest
    container_name: qazar-worker
    restart: unless-stopped
    command: ["node", "server/worker.js"]
    depends_on:
      - api
    environment:
      - DATA_DIR=/app/data
      - PAGE_CONCURRENCY=4
      - ALLOW_PRIVATE=0
    shm_size: '1gb'
    volumes:
      - ./data:/app/data
