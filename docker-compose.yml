services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: qazar:latest
    restart: unless-stopped
    command: ["node", "server/index.js"]
    ports:
      - "8787:8787"
    environment:
      - PORT=8787
      - DATA_DIR=/app/data
      - PAGE_CONCURRENCY=4
      - ALLOW_PRIVATE=0
      - NO_TUNNEL=${NO_TUNNEL:-1}
      - DATABASE_URL=${DATABASE_URL:-}
      - STORAGE_DRIVER=${STORAGE_DRIVER:-local}
      - QAZAR_API_KEYS=${QAZAR_API_KEYS:-}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_PRICE_ID=${STRIPE_PRICE_ID:-}
      - STRIPE_SUCCESS_URL=${STRIPE_SUCCESS_URL:-}
      - STRIPE_CANCEL_URL=${STRIPE_CANCEL_URL:-}
      - LOGI_INK_API_SECRET=${LOGI_INK_API_SECRET:-}
      - LOGI_INK_OWNER_ID=${LOGI_INK_OWNER_ID:-}
      - LOGI_INK_OWNER_EMAIL=${LOGI_INK_OWNER_EMAIL:-}
      - MAIL_PROVIDER=${MAIL_PROVIDER:-}
      - MAIL_API_KEY=${MAIL_API_KEY:-}
      - MAIL_FROM=${MAIL_FROM:-}
      - AGENCY_INBOX=${AGENCY_INBOX:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-}
      - SMTP_SECURE=${SMTP_SECURE:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - QAZAR_PUBLIC_BASE=${QAZAR_PUBLIC_BASE:-}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8787/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: qazar:latest
    restart: unless-stopped
    command: ["node", "server/worker.js"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      - DATA_DIR=/app/data
      - PAGE_CONCURRENCY=4
      - PUBLIC_PAGE_CONCURRENCY=6
      - ALLOW_PRIVATE=0
      - WORKER_IDLE_MS=400
      - DATABASE_URL=${DATABASE_URL:-}
      - STORAGE_DRIVER=${STORAGE_DRIVER:-local}
      - QAZAR_API_KEYS=${QAZAR_API_KEYS:-}
      - LOGI_INK_API_SECRET=${LOGI_INK_API_SECRET:-}
      - LOGI_INK_OWNER_ID=${LOGI_INK_OWNER_ID:-}
      - LOGI_INK_OWNER_EMAIL=${LOGI_INK_OWNER_EMAIL:-}
      - MAIL_PROVIDER=${MAIL_PROVIDER:-}
      - MAIL_API_KEY=${MAIL_API_KEY:-}
      - MAIL_FROM=${MAIL_FROM:-}
      - AGENCY_INBOX=${AGENCY_INBOX:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-}
      - SMTP_SECURE=${SMTP_SECURE:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - STRIPE_SUCCESS_URL=${STRIPE_SUCCESS_URL:-}
      - STRIPE_CANCEL_URL=${STRIPE_CANCEL_URL:-}
      - QAZAR_PUBLIC_BASE=${QAZAR_PUBLIC_BASE:-}
    shm_size: '1gb'
    volumes:
      - ./data:/app/data
# Scale capture workers: docker compose up -d --scale worker=3
