services:
  qazar:
    build:
      context: .
      dockerfile: Dockerfile
    image: qazar:latest
    container_name: qazar-api
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      - PORT=8787
      - DATA_DIR=/app/data
      - PAGE_CONCURRENCY=4
      - ALLOW_PRIVATE=0
    # Crucial for Playwright: allocate 1GB shared memory to avoid Chromium rendering crashes
    shm_size: '1gb'
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8787/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
