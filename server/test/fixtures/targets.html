<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Target size</title>
  <style>
    body { margin: 0; font-size: 16px; }
    button { padding: 0; border: 0; }
    #aa, #one, #two { display: inline-block; }
  </style>
</head>
<body>
  <div style="height:80px">
    <button id="aa" style="width:24px;height:24px">A</button>
  </div>
  <div>
    <button id="one" style="width:20px;height:20px">1</button>
    <button id="two" style="width:20px;height:20px;margin-left:24px">2</button>
  </div>
  <p style="margin-top:80px"><a id="inline" href="#z">x</a></p>
</body>
</html>
