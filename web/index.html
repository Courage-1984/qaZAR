<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>qaZAR – Viewport QA Submission</title><meta name="description" content="Submit a site for viewport UI/UX QA and visual regression testing."><link rel="stylesheet" href="style.css"></head>
<body><nav><a href="./">Submit</a><a href="results.html">Results</a></nav>
<main><h1>qaZAR</h1><p>Viewport UI/UX QA &amp; visual regression.</p>
<form id="f"><label for="domain">Domain</label><input id="domain" type="url" required placeholder="https://example.com">
<label for="sitemap_url">Sitemap URL</label><input id="sitemap_url" type="url" placeholder="https://example.com/sitemap.xml">
<label for="max_pages">Max pages</label><input id="max_pages" type="number" min="1" value="10">
<button id="submit" type="submit">Run QA</button></form><p id="msg"></p></main>
<script>document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();document.getElementById('msg').textContent='Backend not connected yet – coming soon.'})</script></body></html>
